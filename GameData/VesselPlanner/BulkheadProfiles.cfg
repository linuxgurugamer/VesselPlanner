// Descriptions for KSP bulkhead profiles, used by VesselPlanner for the Bulkhead
// column and the Stage-By-Stage bulkhead selector.
//
// For stack profiles, "size" is the integer KSP stores on a part's attachment node and
// implies the KSP bulkheadProfiles token sizeN. A non-stack profile can instead specify
// "profile" directly, such as srf. "name" is what appears in the dropdown and
// "description" is the extra wording shown beside it.
//
// Sizes 0 to 4 are the stock sizes. Sizes 5 and up are here for part packs that add larger
// stacks; edit their names to match whatever diameters your packs actually use, or add
// further PROFILE blocks. A profile in another file that repeats a size replaces the entry
// here, so a pack can correct one of these without this file being edited.

ENGINE_STAGE_PLANNER_BULKHEADS
{
	PROFILE
	{
		size = 0
		name = 0.625 m
		description = Tiny
	}
	PROFILE
	{
		size = 1
		name = 1.25 m
		description = Small
	}
	PROFILE
	{
		profile = size1p5
		name = 1.875 m
		description = Medium
	}
	PROFILE
	{
		size = 2
		name = 2.5 m
		description = Large
	}
	PROFILE
	{
		size = 3
		name = 3.75 m
		description = Extra large
	}
	PROFILE
